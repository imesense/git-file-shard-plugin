[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-file-shard"
version = "0.1.0"
description = "Git plugin for splitting large files into shards and merging them back"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.8"

[project.scripts]
git-file-shard = "git_file_shard.main:main"

[dependency-groups]
dev = ["pyinstaller==6.13.0"]

[tool.uv]
required-version = ">=0.13"

[tool.setuptools.packages.find]
where = ["src"]
