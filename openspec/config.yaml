schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  git-file-shard is a Git plugin (Python 3.8+, MIT license, default branch
  `default`) that splits large files into shards under
  `.git-file-shards/<original/file/path>/` (a `manifest.json` plus `part-N`
  files) and merges them back, so repositories can track large binary assets
  without storing the originals in Git. The original file is appended to
  `.gitignore`. Only files larger than the threshold (default 50 MB) and marked
  `file-shards=auto` in `.gitattributes` are processed; last-match-wins. A file
  is re-split only when its hash differs from the manifest one; stale parts are
  cleaned first. SHA-256 is the default hash, `--md5` switches to MD5.

  The plugin ships as a standalone PyInstaller binary invoked by Git as
  `git file-shard`, plus platform installers: Inno Setup 7 EXE and WiX
  Toolset 7 MSI for Windows, PKG and DMG for macOS, and a DEB package for
  Debian/Ubuntu. Every installer is bound to the architecture of the payload
  it packages (PyInstaller does not cross-compile) and carries it in the
  artifact name.

  Repository layout:
  - `src/git_file_shard/` - plugin core (scan, split, restore, merge, hash).
  - `src/git_hooks/` - Git hooks copied into `.git/hooks/` (pre-commit runs
    `git file-shard scan`; post-checkout and post-merge run
    `git file-shard restore`).
  - `src/installer_windows_inno/` - Windows EXE installer (Inno Setup 7).
  - `src/installer_windows_wix/` - Windows MSI installer (WiX Toolset 7).
  - `src/installer_macos_pkg/` - macOS PKG installer.
  - `src/installer_macos_dmg/` - macOS DMG wrapping the PKG.
  - `src/installer_linux_deb/` - Debian package installer (dpkg-deb).
  - `util/` - thin installer build wrappers (PKG/DMG/DEB, Windows EXE/MSI)
    and the dev container image helper.
  - `doc/` - integration and usage guides.
  - `pyproject.toml`, `uv.lock`, `.python-version` - Python tooling.
  - `.devcontainer/` - Dev Container definition (Python 3.10 + `uv`).
  - `.dockerignore` - build context exclusions for the container image.
  - `.github/workflows/build-application.yml` - CI build.
  - `.github/workflows/build-devcontainers.yml` - CI container image build.


  Verification is command-based: there is no test suite. Python tooling is
  managed with `uv` (`uv.lock` is the source of truth and `.python-version`
  pins 3.10).
  Byte-compile the Python sources
  (`uv run --locked python -m compileall -q src`,
  `uv run --locked python -m py_compile git-file-shard.spec`), syntax-check
  shell scripts with `bash -n`, and build the artifacts affected by the change
  (`uv sync --locked`, `uv run --locked pyinstaller git-file-shard.spec
  --noconfirm`). Every installer expects `dist/git-file-shard.exe` (Windows)
  or `dist/git-file-shard` (Linux, macOS), plus `README.md` and `LICENSE.txt`,
  to exist beforehand. On Windows the architecture-specific
  `util/build-exe-<arch>.bat` and `util/build-msi-<arch>.bat` wrappers share
  `util/_build-windows-installer.bat`, detect the payload architecture from
  its PE header, abort when it does not match the wrapper, and name the
  output after it (`bin/GitFileShardPlugin.<arch>.exe`,
  `bin/<culture>/GitFileShardPlugin.<arch>.msi`).

  The Dev Container (`.devcontainer/`) provides Python 3.10, `uv` 0.13 and
  Git for development and for building the Linux payload with PyInstaller.
  It keeps the `uv` cache (`/uv`) and the virtual environment (`/opt/venv`)
  outside the bind-mounted workspace. It is not a packaging environment:
  the DEB, PKG, DMG, EXE and MSI installers stay on their matching host OS
  or CI runner. Verify it with `docker compose --file
  .devcontainer/docker-compose.yaml --file
  .devcontainer/docker-compose.build.yaml config` and a local image build.


  Conventions: English for code, comments, documentation and OpenSpec
  artifacts; Russian only in localized installer resources. Python uses single
  quotes, 4-space indentation, docstrings on public functions and `Error:` /
  `Warning:` prefixes for user-facing output. Markdown uses CRLF line endings
  and 2-space list indentation. Commit messages are short imperative summaries.

  Capabilities formalized in OpenSpec:
  - `innosetup-installer` - Windows EXE installer (Inno Setup 7).
  - `wix-installer` - Windows MSI installer (WiX Toolset 7).
  - `pkg-installer` - macOS distribution package (`pkgbuild`/`productbuild`).
  - `dmg-installer` - macOS DMG image (`hdiutil`) wrapping the PKG.
  - `deb-installer` - Debian package (`dpkg-deb`) for Debian/Ubuntu.
  - `devcontainer` - Python development container (Python 3.10 + `uv`).

  Core plugin behavior (scan/split/restore/merge/hash) is not formalized as a
  capability yet.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Write all artifacts in English.
  specs:
    - Use the exact existing capability path from `openspec/specs/` for delta specs of existing capabilities.
    - Prefer observable behavior (inputs, outputs, error conditions) over implementation details such as class or function names.
  tasks:
    - Put the verification method in the checkbox description (for example the exact command or the manual test).
    - Cover the build and verification steps that apply to the change (byte-compile, `bash -n`, artifact build, manual install).

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Verify with the commands that match the change (byte-compile, `bash -n`, build the affected installer) and report the actual results.
  archive:
    guidance:
      - Archive only after an explicit user command and after the user has reviewed and verified the change.
      - Archiving never includes a Git commit; commit only when the user explicitly asks for it.
