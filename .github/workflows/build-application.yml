# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build application"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "util/**"
            - "*.py"
            - "*.spec"
    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "util/**"
            - "*.py"
            - "*.spec"

env:
    PLUGIN_VERSION: "0.1.0"

defaults:
    run:
        shell: pwsh

jobs:
    build-application:
        name: 'Build application'

        strategy:
            matrix:
                system:
                    - ubuntu-24.04
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.10'

            - name: Build modules
              run: |
                  python `
                      -m compileall `
                      -q `
                          ${{ github.workspace }}/src
                  python `
                      -m py_compile `
                      ${{ github.workspace }}/git-file-shard.spec

    publish-application:
        name: "Publish application"

        needs:
            - build-application

        strategy:
            matrix:
                system:
                    - windows-2022
                    - ubuntu-24.04
                    - macos-14
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.10'

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  key: Application-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
                  restore-keys: |
                      Application-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
                      Application-${{ hashFiles('**/requirements*.txt') }}
                      Application-
                  path: |
                      ${{ github.workspace }}/.pip/

            - name: Setup dependencies
              run: |
                  pip install `
                      -r ${{ github.workspace }}/requirements.txt `
                      --cache-dir ${{ github.workspace }}/.pip/

            - name: Pack application
              run: |
                  pyinstaller `
                      ${{ github.workspace }}/git-file-shard.spec

            - name: Upload application
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/dist/

    pack-installer-exe:
        name: "Pack EXE installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - windows-2022

        runs-on: ${{ matrix.system }}

        if: false

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup WinGet
              uses: Cyberboss/install-winget@v1

            - name: Setup Inno
              run: |
                  winget install `
                      -e `
                      --id JRSoftware.InnoSetup.7 `
                      --source winget

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              run: |
                  . ISCC.exe `
                      src\ImeSense.GitFileShardPlugin.Setup.Inno\Setup.iss

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-exe-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.exe

    pack-installer-msi:
        name: "Pack MSI installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - windows-2022

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '8.0.x'

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              run: |
                  dotnet build `
                      ${{ github.workspace }}/src/ImeSense.GitFileShardPlugin.Setup.Wix/ImeSense.GitFileShardPlugin.Setup.Wix.wixproj `
                      -c Release `
                      -o ${{ github.workspace }}/bin/

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-msi-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/bin/en-US/GitFileShardPlugin.msi
                      ${{ github.workspace }}/bin/ru-RU/GitFileShardPlugin.msi

    pack-installer-pkg:
        name: "Pack PKG installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - macos-14

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              shell: bash
              run: |
                  ${{ github.workspace }}/util/build-pkg-arm64.sh ${{ env.PLUGIN_VERSION }}

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-pkg-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.v${{ env.PLUGIN_VERSION }}.arm64.pkg

    pack-installer-dmg:
        name: "Pack DMG installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - macos-14

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              shell: bash
              run: |
                  ${{ github.workspace }}/util/build-pkg-arm64.sh ${{ env.PLUGIN_VERSION }} --plain-name
                  ${{ github.workspace }}/util/build-dmg-arm64.sh ${{ env.PLUGIN_VERSION }}

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-dmg-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.v${{ env.PLUGIN_VERSION }}.arm64.dmg
