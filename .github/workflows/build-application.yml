# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build application"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "util/**"
            - "*.py"
            - "*.spec"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "util/**"
            - "*.py"
            - "*.spec"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"

env:
    PLUGIN_VERSION: "0.1.0"

defaults:
    run:
        shell: pwsh

jobs:
    build-application:
        name: 'Build application'

        strategy:
            matrix:
                system:
                    - ubuntu-24.04
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.13.x"
                  python-version: "3.10"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Setup dependencies
              run: |
                  uv sync --locked

            - name: Build modules
              run: |
                  uv run --locked `
                      python `
                      -m compileall `
                      -q `
                          ${{ github.workspace }}/src
                  uv run --locked `
                      python `
                      -m py_compile `
                      ${{ github.workspace }}/git-file-shard.spec

    publish-application:
        name: "Publish application"

        needs:
            - build-application

        strategy:
            matrix:
                system:
                    - windows-2022
                    - ubuntu-24.04
                    - macos-15
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.13.x"
                  python-version: "3.10"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Setup dependencies
              run: |
                  uv sync --locked

            - name: Pack application
              run: |
                  uv run --locked `
                      pyinstaller `
                      ${{ github.workspace }}/git-file-shard.spec

            - name: Upload application
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/dist/

    pack-windows-installer-exe:
        name: "Pack Windows EXE installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - windows-2022

        runs-on: ${{ matrix.system }}

        if: false

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup WinGet
              uses: Cyberboss/install-winget@v1

            - name: Setup Inno
              run: |
                  winget install `
                      -e `
                      --id JRSoftware.InnoSetup.7 `
                      --source winget

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              run: |
                  .\util\build-exe-x64.bat

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-exe-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.x64.exe

    pack-windows-installer-msi:
        name: "Pack Windows MSI installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - windows-2022

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '8.0.x'

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              run: |
                  .\util\build-msi-x64.bat

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-msi-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/bin/en-US/GitFileShardPlugin.x64.msi
                      ${{ github.workspace }}/bin/ru-RU/GitFileShardPlugin.x64.msi

    pack-macos-installer-pkg:
        name: "Pack macOS PKG installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - macos-15

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              shell: bash
              run: |
                  ${{ github.workspace }}/util/build-pkg-arm64.sh ${{ env.PLUGIN_VERSION }}

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-pkg-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.v${{ env.PLUGIN_VERSION }}.arm64.pkg

    pack-macos-installer-dmg:
        name: "Pack macOS DMG installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - macos-15

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              shell: bash
              run: |
                  ${{ github.workspace }}/util/build-pkg-arm64.sh ${{ env.PLUGIN_VERSION }} --plain-name
                  ${{ github.workspace }}/util/build-dmg-arm64.sh ${{ env.PLUGIN_VERSION }}

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-dmg-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/GitFileShardPlugin.v${{ env.PLUGIN_VERSION }}.arm64.dmg

    pack-linux-installer-deb:
        name: "Pack Linux DEB installer"

        needs:
            - publish-application

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Get application
              uses: actions/download-artifact@v8
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/dist/

            - name: Publish installer
              shell: bash
              run: |
                  ${{ github.workspace }}/util/build-deb-amd64.sh ${{ env.PLUGIN_VERSION }} --distro ubuntu24.04

            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-installer-deb-${{ matrix.system }}-${{ github.sha }}
                  path: ${{ github.workspace }}/bin/git-file-shard_${{ env.PLUGIN_VERSION }}_ubuntu24.04_amd64.deb
